# Private build of 3DLib for my own TrueNAS.
# Every push to main runs the test suite and publishes
#   ghcr.io/<owner>/3dlib:latest  and  :sha-<commit>
# The image name is fixed, so it does not change with the repository name.
name: Custom image (TrueNAS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: custom-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same Node as the image (Dockerfile: node:22-alpine)
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/3dlib" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # amd64 only: the TrueNAS box is an Intel i5, and skipping the arm64 (QEMU)
      # build keeps each run to a few minutes of the private-repo Actions quota.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # Links the package to this repository, so it gets the repository's access
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
