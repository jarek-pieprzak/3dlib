services:
  3dlib:
    image: ghcr.io/jarek-pieprzak/3dlib:latest
    container_name: 3dlib
    ports:
      - "${PORT:-3457}:3000"
    volumes:
      - ./data:/app/data
      - ./library:/library
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LIBRARY_PATH=/library
    restart: unless-stopped
